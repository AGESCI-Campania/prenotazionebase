# Manuale d'uso di Tana su Read the Docs (cartella manuale/). La specifica e la guida del server
# in docs/ non si pubblicano.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: manuale/conf.py
  fail_on_warning: true

formats:
  - pdf

python:
  install:
    - requirements: manuale/requirements.txt
