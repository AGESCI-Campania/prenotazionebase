name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.7-trixie
        env:
          POSTGRES_DB: tana
          POSTGRES_USER: tana
          POSTGRES_PASSWORD: tana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tana -d tana"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-non-segreta
      DATABASE_URL: postgres://tana:tana@localhost:5432/tana
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
      - name: Migrazioni allineate ai modelli
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Test
        run: uv run pytest
      - name: Controlli di produzione
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: baseaiello.agescicampania.net
          LOG_DIR: /tmp/logs
        run: uv run python manage.py check --deploy --fail-level WARNING

  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x scripts/*.sh deploy/entrypoint.sh
      - name: Bit eseguibile committato
        run: test -x scripts/installa.sh && test -x scripts/aggiorna.sh && test -x scripts/backup.sh
      - name: Compose valido
        run: |
          cp .env.template .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker network create agesci-proxy
          docker compose config --quiet
      - name: Build delle immagini
        run: docker compose build web nginx
